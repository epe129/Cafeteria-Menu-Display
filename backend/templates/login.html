<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        #submit {
            text-align: right;
            float: right;
        }

    </style>
</head>
<body>
    <div>
        <h1>Log in</h1>
        <form action="{{ url_for('login') }}" method="POST">
            {{ form.hidden_tag() }}  
            <label for="Username">Username:</label>
            {{ form.Username() }}  
            <br/>
            <br/>
            <label for="Pword">Password:</label>
            {{ form.Pword() }}  
            <br/>
            <p>{{ text }}</p>
            {{ form.submit() }}  
        </form>
    </div>
</body>
</html>
