<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #2c2c2c;
            color: white;
        }
        div {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
         #submit {
            padding: 3px 5px;
            background-color: #0044ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>
    <div>
        <h1>Log in</h1>
        <form action="{{ url_for('login') }}" method="POST">
            {{ form.hidden_tag() }}  
            <label for="Username">Username:</label>
            {{ form.Username() }}  
            <br/>
            <br/>
            <label for="Pword">Password:</label>
            {{ form.Pword() }}  
            <br/>
            <p>{{ text }}</p>
            {{ form.submit() }}  
        </form>
    </div>
</body>
</html>
